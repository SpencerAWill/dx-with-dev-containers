# Per-worktree isolation comes from VS Code's dev containers extension,
# which generates a unique compose project name per workspace folder
# path. Two worktrees in different directories therefore get distinct
# networks, containers, and volume namespaces automatically — no
# explicit top-level `name:` is needed (and compose doesn't support
# interpolation in that field anyway).

# Every emulator image is pinned to an exact version rather than a moving
# tag. With `:latest`, two developers — or the same developer either side of
# a rebuild — can run different emulator builds against identical source, and
# the difference only shows up as a behaviour change nobody can reproduce.
# Bump these deliberately, in a commit that says so.

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # Hostname mirrors the worktree directory so shell prompts and
    # `docker ps` are readable when multiple worktrees run in parallel.
    hostname: ${WORKTREE_NAME:-snapsort}
    volumes:
      # Mounts the PARENT of the worktree, not the worktree itself.
      #
      # In the bare-repo layout a worktree's .git is a file pointing at
      # <parent>/.bare/worktrees/<name>, which sits outside the worktree. Mount
      # only the worktree and that target is not in the container at all, so
      # every git command fails with "not a git repository". Mounting the parent
      # brings .bare — and the sibling worktrees — inside with it.
      #
      # workspaceFolder in devcontainer.json then selects the worktree via
      # ${localWorkspaceFolderBasename}, so this works in both layouts.
      - ../..:/workspaces:cached
      - bashhistory:/commandhistory
      - claude-code-config:/home/vscode/.claude
      # Inherit the host's `gh auth login` rather than logging in again in
      # every worktree's container. Carries a token only if the host stored
      # it in ~/.config/gh/hosts.yml — on macOS that means the host ran
      # `gh auth login --insecure-storage` once, since a Keychain-stored
      # token does not cross the mount. Shared across worktrees on purpose:
      # one login on the host is one login everywhere.
      - ${HOME}/.config/gh:/home/vscode/.config/gh:cached
    environment:
      DEVCONTAINER: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      # The host's git identity, resolved by init.sh and written to
      # .devcontainer/.env; configure-git.sh applies it inside the container.
      # Deliberately not left to VS Code's `dev.containers.copyGitConfig` — that
      # is a per-machine editor setting, so whether commits get an author would
      # otherwise depend on how each person's editor happens to be configured.
      # Empty if the host has no identity set; configure-git.sh warns then.
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      ConnectionStrings__AppDb: "Server=app-mssql;Database=SnapSort;User Id=sa;Password=App_Passw0rd!;TrustServerCertificate=true"
      ConnectionStrings__ServiceBus: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ConnectionStrings__AzureStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      VisionModel__Endpoint: "http://host.docker.internal:12434"
      VisionModel__Model: "ai/gemma3:4B-Q4_K_M"
      # Keep `expo start` from preparing the React Native DevTools shell. It is a
      # 115 MB Electron app, downloaded per container and linked against the whole
      # GTK/X11/NSS stack, none of which is in this image — so every mobile start
      # ended in "An unknown error occurred while installing React Native DevTools"
      # (libglib-2.0.so.0). Nothing is lost: a desktop window has no display to
      # open on in here. Read by a one-line patch to @expo/cli; see
      # patches/@expo__cli@57.0.22.patch and pnpm-workspace.yaml.
      EXPO_NO_DEVTOOLS_SHELL: "1"
    models:
      - vision-model
    depends_on:
      app-mssql:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
      azurite:
        condition: service_healthy
    command: sleep infinity

  # Application SQL Server — stores SnapSort image metadata and classification results
  app-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    platform: linux/amd64
    restart: unless-stopped
    # No host port mapping: the app talks to "app-mssql:1433" over the
    # internal compose network. Keeping the port off the host avoids
    # collisions between parallel worktrees.
    volumes:
      - app-mssql-data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "App_Passw0rd!"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "App_Passw0rd!",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dedicated SQL Server for the Service Bus Emulator — kept separate to avoid conflicts
  servicebus-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - servicebus-mssql-data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ServiceBus0!"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "ServiceBus0!",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Azure Service Bus Emulator — provides the image-processing queue
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    restart: unless-stopped
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-mssql
      MSSQL_SA_PASSWORD: "ServiceBus0!"
    depends_on:
      servicebus-mssql:
        condition: service_healthy

  # Azurite — Azure Storage emulator for blob, queue, and table storage
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 5

# Docker Model Runner — vision model for image descriptions
models:
  vision-model:
    model: ai/gemma3:4B-Q4_K_M
    context_size: 4096

volumes:
  bashhistory:
  # Marked external so every worktree's container shares one Claude
  # login + memory + settings, AND so it survives `docker compose
  # down -v` (a pinned `name:` alone would not — only `external: true`
  # opts a volume out of the down -v sweep). The volume is created
  # idempotently by .devcontainer/init.sh on the host before compose
  # comes up. The other named volumes get the per-project prefix from
  # compose, isolating their data per worktree.
  claude-code-config:
    external: true
    name: claude-code-config-shared
  app-mssql-data:
  servicebus-mssql-data:
  azurite-data:
