packages:
  - apps/web-app
  - apps/mobile

# Dependencies allowed to run install scripts. pnpm blocks them by default and
# writes a placeholder here for anything it finds — resolve those to true or
# false rather than leaving them, since an unresolved entry fails the install.
#
#   esbuild        native binary, used by the Vite toolchain at build time
#   unrs-resolver  native binary behind the ESLint import resolver; `expo lint`
#                  shells out to `pnpm install`, which refuses to run until this
#                  is answered, so mobile linting fails without it
allowBuilds:
  esbuild: true
  unrs-resolver: true

# pnpm holds back freshly published versions for a cooldown period. The SDK 57
# packages below were newer than that when the upgrade ran, so pnpm recorded
# them here to let the install through. Prune stale entries on the next bump.
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.22"
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - "@expo/ui@57.0.16"
  - expo-image-manipulator@57.0.16
  - expo-image-picker@57.0.16
  - expo-router@57.0.19

# @expo/cli only lets you switch off the React Native DevTools shell as a side
# effect of EXPO_UNSTABLE_HEADLESS, which also disables the interactive TUI and
# therefore the QR code. This one-line patch gives the shell its own opt-out,
# EXPO_NO_DEVTOOLS_SHELL, which docker-compose.yml sets for the dev container.
# The version is exact on purpose: an @expo/cli bump makes the install fail
# loudly here rather than silently dropping the patch.
patchedDependencies:
  "@expo/cli@57.0.22": patches/@expo__cli@57.0.22.patch
